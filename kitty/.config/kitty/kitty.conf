# include pywal colors
# include ~/.config/kitty/colors-kitty.conf

include ~/.cache/wal/colors-kitty.conf

# font_family JetBrainsMono Nerd Font
# font_family Caskaydia Cove Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

cursor_trail 3
#cursor #8dffec
cursor_shape beam
cursor_shape_unfocused hollow
cursor_stop_blinking_after 15.0
cursor_trail_color none

background_opacity 0.85
blur 1

font_size 14.0

initial_window_width 95c
initial_window_height 35c

enable_image_protocol yes
enable_audio_bell no

# window
window_padding_width 5
window_margin_width 5
window_border_width 2px
#active_border_color #c4c2c5
#inactive_border_color #7D89F1
#bell_border_color #ff5a00
enabled_layouts Tall, *

map kitty_mod+j third_window
map kitty_mod+l second_window
map kitty_mod+h first_window
map ctrl+shift+[ next_window

scrollback_lines 300

scrollbar hovered
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 1
scrollbar_hover_width 2
scrollbar_gap 0.3
scrollbar_min_handle_height 1
scrollbar_hitbox_expansion 0.5

wheel_scroll_multiplier 5.0
touch_scroll_multiplier 4.0

momentum_scroll 0.98

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

inactive_text_alpha 0.8

#url_color #2550ff
url_style curly
open_url_with default
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks always

strip_trailing_spaces smart

focus_follows_mouse yes

repaint_delay 10
sync_to_monitor yes

enable_audio_bell yes
visual_bell_duration 0.5
#visual_bell_color #8dffec
bell_on_tab "🔔 "

remember_window_size  yes
remember_window_position no
initial_window_width  640
initial_window_height 400

window_logo_path none
window_logo_alpha 0.5

window_drag_tolerance 10

allow_remote_control yes

confirm_os_window_close 0
