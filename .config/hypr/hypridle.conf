general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 380
    on-timeout = notify-send "Hypridle" "locking screen in 20 seconds."
}

listener {
    timeout = 400
    on-timeout = lock_cmd; loginctl lock-session
}

listener {
    timeout = 580
    on-timeout = notify-send "Hypridle" "Hibernating in 20 seconds."
}

listener {
    timeout = 600
    on-timeout = lock_cmd; systemctl sleep
}
