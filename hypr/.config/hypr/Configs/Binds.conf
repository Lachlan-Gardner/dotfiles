###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/Configs/Default-Apps.conf

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, T, exec, [float] $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, [float] $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, exec, $browser
bind = $mainMod SHIFT, F, exec, hyprctl dispatch workspace empty && firefox --new-window
bind = ALT, M, layoutmsg, swapwithmaster
bind = $mainMod, L, exec, hyprlock

bind = , F11, exec, hyprshot -m region -z -o ~/Screenshots/

bind = $mainMod SHIFT, B, exec, [workspace empty] kitty --hold -e btop

bind = ALT, R, exec, $menu
bind = ALT, W, exec, rofi-wifi-menu.sh
bind = ALT, B, exec, rofi-bluetooth
bind = ALT, C, exec, config-chooser
bind = ALT, P, exec, rofi-power-menu
bind = ALT, T, exec, rofi-wallpaper-switcher
//bind = ALT, S, exec, ~/Scripts/System-Maintenance
bind = ALT, Q, exec, ~/Scripts/Clipboard-History

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALt, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT, 0, workspace, 10
bind = ALT, Tab, workspace, previous

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

bind = $mainMod, A, fullscreen

bind = $mainMod, D, exec, hyprctl keyword general:layout "dwindle"
bind = $mainMod, P, exec, hyprctl keyword general:layout "master"
bind = $mainMod, M, exec, hyprctl keyword general:layout "monocle"

bind = ALT, A, layoutmsg, cycleprev
bind = ALT, S, layoutmsg, cyclenext

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Means the sleeping works more than once after start up. logind.conf handleonlid needs to be set to ignore
bind = ,switch:on:Lid Switch, exec, systemctl sleep

# Requires playerctl
bindl = ALT, Z, exec, playerctl next
bindl = ALT, X, exec, playerctl play-pause

bind = , F7, exec, hyprctl dispatch dpms off
bind = , F7, submap, black_screen

submap = black_screen

bind = , F7, exec, hyprctl dispatch dpms on
bind = , F7, submap, reset

bind = , escape, exec, hyprctl dispatch dpms on
bind = , escape, submap, reset

submap = reset
